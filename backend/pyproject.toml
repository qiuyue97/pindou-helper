[project]
name = "pindou-helper-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "sqlalchemy>=2.0",
  "pydantic>=2.6",
  "pydantic-settings>=2.1",
  "argon2-cffi>=23.1",
  "pyjwt>=2.8",
  # 智能管控要调外部 LLM 网关；stdlib 的 urllib 没法分别设连接/读取超时。
  "httpx>=0.27",
  # 图纸识别接口收 multipart 上传；FastAPI 不自带这个解析器。
  "python-multipart>=0.0.9",
  # 图片要压进上游的内联媒体上限（2 MiB/请求），靠它重编码和量化调色板。
  "pillow>=10.0",
  # 量化后的色差要按 CIEDE2000 报出来，逐像素算，纯 Python 跑不动。
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = ["B008"]  # Depends()/Query() in arg defaults is the FastAPI idiom

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# catalog.json is the 291-colour source of truth and is read via
# Path(__file__).with_name(). Without this it is silently dropped from the
# wheel and the app dies at import time with FileNotFoundError.
include-package-data = true

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["*.json"]
